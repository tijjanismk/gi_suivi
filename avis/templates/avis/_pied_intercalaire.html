{% comment %} Pied d'une feuille d'intercalaires : l'image PIED (logos du bureau, ou du groupement pour cet avis). Paramètres : a (l'avis), pied. {% endcomment %}
<footer class="pied">{% if pied %}<img class="pied-image" src="{% url 'avis:image_intercalaire' a.pk 'pied' %}" alt="Logos du bureau">{% endif %}</footer>
