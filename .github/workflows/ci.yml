name: CI

on:
  push:
    branches: ["main", "dev/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint et format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests (moteur + Django)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gic
          POSTGRES_PASSWORD: gic
          POSTGRES_DB: gic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://gic:gic@localhost:5432/gic_test
      SECRET_KEY: ci-seulement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Tests rapides (moteur, unitaires, intégration)
        run: pytest --cov=moteur --cov=suivi --cov=identite --cov=administratif --cov-report=term-missing -m "not e2e and not windows"
      - name: Parcours de bout en bout
        # Code 5 = aucun test collecté : normal tant que le parcours e2e (phase 4) n'existe pas
        run: pytest -m e2e || [ $? -eq 5 ]

  agent:
    name: Agent (tests hors Windows)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      # Seule la logique pure de l'agent (analyse des titres, segmentation)
      # est testée ici ; les tests marqués "windows" tournent à la main sur
      # un poste du domaine avant chaque construction de MSI.
      - run: pytest agent/tests -m "not windows"

  # La construction du MSI (PyInstaller + WiX) se fait sur un poste Windows
  # du bureau, pas dans la CI : voir agent/construire.ps1 et docs/exploitation.md.
